# Every repository under github.com/chrisguidry that is neither a fork nor
# archived, and what it sets beyond the standard in repositories.tf and
# rulesets.tf. An entry of {} takes the standard as it is.
#
#   visibility: private    The repository is private. GitHub's Free plan
#                          gives a private repository no rulesets and no
#                          secret scanning, so it gets neither.
#   discussions: true      GitHub Discussions are on.
#   tier: pr               Changes reach main only through a pull request
#                          whose "All checks passed" job succeeded.
#   tier: checks           The admins push to main as in the standard.
#                          Anything else reaches main only on a commit
#                          whose "All checks passed" job succeeded, so
#                          GitHub's auto-merge waits for CI.
#   extra_checks: [...]    Further status checks the pr tier requires,
#                          for checks that come from outside GitHub
#                          Actions and so cannot be among that job's needs.
#   workflow_tags: true    A workflow creates the repository's release
#                          tags with its own token, so anyone who can push
#                          may create a tag. Moving and deleting one stay
#                          with the admins.
#   dependabot: [...]      The package ecosystems that Dependabot updates,
#                          besides github-actions, which every repository
#                          gets. Each entry names an ecosystem, and may
#                          set directories, which default to the root,
#                          and ignore, a list of dependencies that
#                          Dependabot leaves alone. Each ignored
#                          dependency gives a reason, and may give the
#                          versions that the reason covers.
#                          A uv entry also sets project. For a
#                          library, Dependabot updates only uv.lock, so
#                          the requirements in pyproject.toml stay as
#                          low as the library supports. For an
#                          application, it raises each requirement to
#                          the version it locks.
#   dependabot: false      The repository has no workflows and no
#                          dependencies, so it gets no dependabot.yml.
#                          Dependabot fails a github-actions update that
#                          finds no workflow.

.github:
  dependabot:
    - ecosystem: terraform

chrisguidry:
  dependabot: false

docket:
  discussions: true
  tier: pr
  dependabot:
    - ecosystem: uv
      project: library
    - ecosystem: cargo
      directories: [/rust]

etrade-mcp:
  tier: checks
  dependabot:
    - ecosystem: uv
      project: application

healthchecks-operator:
  tier: checks
  dependabot:
    - ecosystem: gomod
    - ecosystem: docker

measured:
  tier: pr
  extra_checks:
    - docs/readthedocs.org:measured
  dependabot:
    - ecosystem: uv
      project: library
      ignore:
        - dependency: pytest-cov
          versions: [">=7"]
          reason: |-
            pytest-cov 7 starts measuring after the pytest11 entry point
            has imported measured, so coverage misses every module-level
            line.
        - dependency: pymdown-extensions
          versions: [">=13"]
          reason: |-
            measured caps pymdown-extensions below 13 for its docs
            build, and 13 needs Python 3.11.5 where measured supports
            3.11, so an update to it does not resolve.

opentelemetry-container-distro:
  tier: checks
  dependabot:
    - ecosystem: uv
      project: library

opentelemetry-resourcedetector-docker:
  tier: checks
  dependabot:
    - ecosystem: uv
      project: library

opentelemetry-resourcedetector-kubernetes:
  tier: checks
  dependabot:
    - ecosystem: uv
      project: library

opentelemetry-resourcedetector-process:
  tier: checks
  dependabot:
    - ecosystem: uv
      project: library

paperless-mcp:
  tier: checks
  dependabot:
    - ecosystem: uv
      project: application
    - ecosystem: docker

pi-deepinfra:
  tier: checks
  dependabot:
    - ecosystem: npm

prometheus-mcp:
  tier: checks
  dependabot:
    - ecosystem: uv
      project: application
    - ecosystem: docker

pytest-opentelemetry:
  tier: pr
  dependabot:
    - ecosystem: uv
      project: library

redis-operator:
  tier: checks
  dependabot:
    - ecosystem: gomod
    - ecosystem: docker

transom:
  tier: checks
  workflow_tags: true
  dependabot:
    - ecosystem: cargo
    - ecosystem: docker
      directories: [/server, /gateway]
    - ecosystem: terraform
      directories: [/gateway, /site]
    - ecosystem: gradle
      directories: [/android]
      ignore:
        - dependency: org.robolectric:android-all-instrumented
          reason: |-
            Robolectric runs only the framework jar its own release
            names, so this moves when Robolectric does, by hand.

uncalled-for:
  discussions: true
  tier: pr
  dependabot:
    - ecosystem: uv
      project: library

you-need-an-mcp:
  tier: checks
  dependabot:
    - ecosystem: uv
      project: application
    - ecosystem: docker
