name: Terraform

# A pull request plans, so its changes to the repositories' settings are
# read before they merge, and a push to main applies them. Each day a plan
# with no changes in it passes, and a plan with any fails, so a setting
# changed by hand, a repository that repositories.yaml does not list, or a
# GitHub App key that stopped working says so.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Two runs never hold the state at once, and an apply is never cancelled
# partway.
concurrency:
  group: terraform
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_ACCESS_KEY }}
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The settings need Administration, which the workflow's own token
      # cannot carry. The chrisguidry-settings GitHub App has it, with
      # Contents read, on every chrisguidry repository.
      # This step makes a token of the App's that lasts an hour.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: settings-token
        with:
          client-id: ${{ vars.SETTINGS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SETTINGS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-administration: write
          permission-contents: read

      # Terraform's provider reads GITHUB_TOKEN, and gh reads GH_TOKEN.
      - name: Give the token to Terraform and gh
        env:
          TOKEN: ${{ steps.settings-token.outputs.token }}
        run: |
          echo "GITHUB_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "GH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate

      - name: Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false -lock-timeout=5m

      # -detailed-exitcode exits 2 when the plan has changes, which fails
      # the run.
      - name: Plan, failing on any change
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: terraform plan -input=false -detailed-exitcode -lock-timeout=5m

      - name: Report CodeQL that is off
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: ./code-scanning.sh

      - name: Report forks' pull requests that run without approval
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: ./actions.sh

      - name: Report private vulnerability reporting that is off
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: ./vulnerability-reporting.sh

      - name: Apply
        if: github.event_name == 'push'
        run: terraform apply -input=false -auto-approve -lock-timeout=5m

      - name: Turn on CodeQL that is off
        if: github.event_name == 'push'
        run: ./code-scanning.sh --apply

      - name: Require approval for forks' pull requests
        if: github.event_name == 'push'
        run: ./actions.sh --apply

      - name: Turn on private vulnerability reporting
        if: github.event_name == 'push'
        run: ./vulnerability-reporting.sh --apply
